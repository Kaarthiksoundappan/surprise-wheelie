<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Surprise Wheelie</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rose: #E8748A; --deep: #C1466A; --blush: #FAE8ED;
      --soft: #FDF4F6; --ink: #2A1A20; --muted: #8C6070;
      --gold: #F0C060; --green: #4CAF82; --red: #E05060;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--soft); color: var(--ink);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px 48px;
    }

    /* ── PIN Gate ─────────────────────────────── */
    #pin-gate {
      position: fixed; inset: 0;
      background: var(--soft);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; padding: 24px;
    }
    #pin-gate h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; color: var(--deep); margin-bottom: 8px;
    }
    #pin-gate p { color: var(--muted); margin-bottom: 32px; }
    .pin-dots {
      display: flex; gap: 14px; margin-bottom: 24px;
    }
    .pin-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: #E8D0D8; transition: background 0.2s;
    }
    .pin-dot.filled { background: var(--rose); }
    .pin-keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; max-width: 260px; width: 100%;
    }
    .pin-key {
      padding: 18px; border: none; border-radius: 14px;
      background: #fff; color: var(--ink);
      font-family: 'DM Sans', sans-serif; font-size: 1.3rem; font-weight: 500;
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .pin-key:hover { background: var(--blush); transform: scale(1.04); }
    .pin-key:active { transform: scale(0.97); }
    .pin-key.delete { color: var(--muted); }
    .pin-key.zero { grid-column: 2; }
    #pin-error {
      margin-top: 16px; color: var(--red);
      font-size: 0.9rem; min-height: 20px; text-align: center;
    }

    /* ── Admin UI ─────────────────────────────── */
    #admin-ui { display: none; width: 100%; max-width: 580px; }

    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--deep); }
    header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .card {
      background: #fff; border-radius: 20px;
      padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }
    .card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem; color: var(--deep); margin-bottom: 18px;
    }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #E8D0D8; border-radius: 10px;
      font-family: inherit; font-size: 0.95rem; color: var(--ink);
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--rose); }

    .btn {
      padding: 12px 28px; border: none; border-radius: 10px;
      font-family: inherit; font-weight: 500; font-size: 0.95rem;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--rose); color: #fff; }
    .btn-primary:hover { background: var(--deep); }
    .btn-danger  { background: #fff; color: var(--red); border: 1.5px solid #FFCCD5; }
    .btn-danger:hover  { background: #fff0f2; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:hover { background: #3a9a6e; }

    /* Outfit list */
    #outfit-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    #outfit-list li {
      background: var(--blush); border-radius: 12px;
      padding: 14px 16px;
    }
    .outfit-row {
      display: flex; align-items: center; gap: 10px;
    }
    .outfit-info { flex: 1; min-width: 0; }
    .outfit-info .name { font-weight: 500; color: var(--ink); font-size: 0.95rem; }
    .outfit-info .url {
      color: var(--rose); font-size: 0.78rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 240px;
    }
    .outfit-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      background: #fff; border: none; border-radius: 8px;
      padding: 6px 10px; cursor: pointer; font-size: 1rem;
      color: var(--muted); transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: #ffe0e6; color: var(--red); }
    .icon-btn.edit:hover { background: #fff3cc; color: #b08000; }

    /* Inline edit form inside li */
    .edit-form { margin-top: 12px; display: none; }
    .edit-form.open { display: flex; flex-direction: column; gap: 8px; }
    .edit-form input {
      padding: 9px 12px; border: 1.5px solid #E8D0D8; border-radius: 8px;
      font-family: inherit; font-size: 0.9rem; color: var(--ink);
      outline: none; transition: border-color 0.2s;
    }
    .edit-form input:focus { border-color: var(--rose); }
    .edit-form-actions { display: flex; gap: 8px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: #2A1A20; color: #fff; padding: 12px 24px;
      border-radius: 100px; font-size: 0.9rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 200; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Loader */
    .mini-loader { text-align:center; color:var(--muted); padding: 20px; font-size:0.9rem; }

    .logout-btn {
      background: none; border: none; color: var(--muted);
      font-family: inherit; font-size: 0.85rem; cursor: pointer;
      margin-top: 12px; text-decoration: underline;
    }
  </style>
</head>
<body>

<!-- PIN Gate -->
<div id="pin-gate">
  <h1>🔐 Admin Access</h1>
  <p>Enter your PIN to continue</p>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
    <div class="pin-dot" id="d5"></div>
    <div class="pin-dot" id="d6"></div>
    <div class="pin-dot" id="d7"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" data-n="1">1</button>
    <button class="pin-key" data-n="2">2</button>
    <button class="pin-key" data-n="3">3</button>
    <button class="pin-key" data-n="4">4</button>
    <button class="pin-key" data-n="5">5</button>
    <button class="pin-key" data-n="6">6</button>
    <button class="pin-key" data-n="7">7</button>
    <button class="pin-key" data-n="8">8</button>
    <button class="pin-key" data-n="9">9</button>
    <button class="pin-key delete" data-n="del">⌫</button>
    <button class="pin-key zero" data-n="0">0</button>
  </div>
  <div id="pin-error"></div>
</div>

<!-- Admin UI -->
<div id="admin-ui">
  <header>
    <h1>Surprise Wheelie 💕</h1>
    <p>Manage outfits — only you can see the links</p>
  </header>

  <!-- Add outfit -->
  <div class="card">
    <h3>Add New Outfit</h3>
    <div class="field">
      <label>Outfit Name (shown on wheel)</label>
      <input type="text" id="inp-name" placeholder="e.g. Red Floral Dress"/>
    </div>
    <div class="field">
      <label>Buy Link (hidden from spin page)</label>
      <input type="url" id="inp-url" placeholder="https://shop.example.com/outfit"/>
    </div>
    <button class="btn btn-primary" id="add-btn">Add to Wheel</button>
  </div>

  <!-- Outfit list -->
  <div class="card">
    <h3>Outfits on the Wheel</h3>
    <div class="mini-loader" id="list-loader">Loading…</div>
    <ul id="outfit-list"></ul>
  </div>

  <div style="text-align:center;">
    <button class="logout-btn" id="logout-btn">Lock &amp; Logout</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────
  const firebaseConfig = {
    apiKey:            "REPLACE_WITH_YOUR_API_KEY",
    authDomain:        "REPLACE_WITH_YOUR_AUTH_DOMAIN",
    projectId:         "REPLACE_WITH_YOUR_PROJECT_ID",
    storageBucket:     "REPLACE_WITH_YOUR_STORAGE_BUCKET",
    messagingSenderId: "REPLACE_WITH_YOUR_MESSAGING_SENDER_ID",
    appId:             "REPLACE_WITH_YOUR_APP_ID"
  };
  // ─────────────────────────────────────────────────────────────────

  const CORRECT_PIN = "07092026";

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ── PIN Logic ─────────────────────────────────────────────────────
  let pinBuffer = "";
  const pinGate  = document.getElementById("pin-gate");
  const adminUI  = document.getElementById("admin-ui");
  const pinError = document.getElementById("pin-error");

  function updateDots() {
    for (let i = 0; i < 8; i++) {
      document.getElementById(`d${i}`).classList.toggle("filled", i < pinBuffer.length);
    }
  }

  document.querySelectorAll(".pin-key").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = btn.dataset.n;
      if (n === "del") {
        pinBuffer = pinBuffer.slice(0, -1);
        pinError.textContent = "";
      } else if (pinBuffer.length < 8) {
        pinBuffer += n;
      }
      updateDots();
      if (pinBuffer.length === 8) checkPin();
    });
  });

  function checkPin() {
    if (pinBuffer === CORRECT_PIN) {
      pinGate.style.display = "none";
      adminUI.style.display = "block";
      loadOutfits();
    } else {
      pinError.textContent = "Wrong PIN. Try again.";
      pinBuffer = "";
      updateDots();
      setTimeout(() => { pinError.textContent = ""; }, 2000);
    }
  }

  document.getElementById("logout-btn").addEventListener("click", () => {
    pinBuffer = ""; updateDots();
    adminUI.style.display = "none";
    pinGate.style.display = "flex";
  });

  // ── Toast ─────────────────────────────────────────────────────────
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  // ── Firestore CRUD ────────────────────────────────────────────────
  let outfits = [];

  async function loadOutfits() {
    document.getElementById("list-loader").style.display = "block";
    document.getElementById("outfit-list").innerHTML = "";
    try {
      const snap = await getDocs(collection(db, "outfits"));
      outfits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) { console.error(e); toast("Firebase error — check config."); }
    document.getElementById("list-loader").style.display = "none";
    renderList();
  }

  async function addOutfit() {
    const name = document.getElementById("inp-name").value.trim();
    const url  = document.getElementById("inp-url").value.trim();
    if (!name || !url) { toast("Fill in both fields."); return; }
    try { new URL(url); } catch { toast("Enter a valid URL."); return; }
    const btn = document.getElementById("add-btn");
    btn.disabled = true; btn.textContent = "Adding…";
    try {
      const ref = await addDoc(collection(db, "outfits"), { name, url });
      outfits.push({ id: ref.id, name, url });
      document.getElementById("inp-name").value = "";
      document.getElementById("inp-url").value  = "";
      renderList(); toast("Outfit added! 🎉");
    } catch(e) { console.error(e); toast("Failed to add. Check Firebase."); }
    btn.disabled = false; btn.textContent = "Add to Wheel";
  }

  async function deleteOutfit(id) {
    if (!confirm("Remove this outfit from the wheel?")) return;
    try {
      await deleteDoc(doc(db, "outfits", id));
      outfits = outfits.filter(o => o.id !== id);
      renderList(); toast("Outfit removed.");
    } catch(e) { console.error(e); toast("Delete failed."); }
  }

  async function saveEdit(id, newName, newUrl) {
    if (!newName || !newUrl) { toast("Fill in both fields."); return; }
    try { new URL(newUrl); } catch { toast("Enter a valid URL."); return; }
    try {
      await updateDoc(doc(db, "outfits", id), { name: newName, url: newUrl });
      const o = outfits.find(x => x.id === id);
      if (o) { o.name = newName; o.url = newUrl; }
      renderList(); toast("Outfit updated ✓");
    } catch(e) { console.error(e); toast("Update failed."); }
  }

  // ── Render ────────────────────────────────────────────────────────
  function renderList() {
    const ul = document.getElementById("outfit-list");
    ul.innerHTML = "";
    if (outfits.length === 0) {
      ul.innerHTML = `<li style="color:var(--muted);text-align:center;padding:16px;font-size:0.9rem;">No outfits yet — add one above!</li>`;
      return;
    }
    outfits.forEach(o => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="outfit-row">
          <div class="outfit-info">
            <div class="name">${escHtml(o.name)}</div>
            <div class="url">${escHtml(o.url)}</div>
          </div>
          <div class="outfit-actions">
            <button class="icon-btn edit" title="Edit" data-id="${o.id}">✏️</button>
            <button class="icon-btn" title="Delete" data-id="${o.id}" data-del>🗑️</button>
          </div>
        </div>
        <div class="edit-form" id="ef-${o.id}">
          <input type="text" class="ef-name" value="${escHtml(o.name)}" placeholder="Outfit name"/>
          <input type="url"  class="ef-url"  value="${escHtml(o.url)}"  placeholder="Buy link"/>
          <div class="edit-form-actions">
            <button class="btn btn-success ef-save" data-id="${o.id}">Save</button>
            <button class="btn btn-danger  ef-cancel" data-id="${o.id}">Cancel</button>
          </div>
        </div>
      `;
      ul.appendChild(li);

      // Edit toggle
      li.querySelector(".icon-btn.edit").addEventListener("click", () => {
        const ef = document.getElementById(`ef-${o.id}`);
        ef.classList.toggle("open");
      });
      // Delete
      li.querySelector("[data-del]").addEventListener("click", () => deleteOutfit(o.id));
      // Save edit
      li.querySelector(".ef-save").addEventListener("click", () => {
        const ef = document.getElementById(`ef-${o.id}`);
        saveEdit(o.id, ef.querySelector(".ef-name").value.trim(), ef.querySelector(".ef-url").value.trim());
      });
      // Cancel edit
      li.querySelector(".ef-cancel").addEventListener("click", () => {
        document.getElementById(`ef-${o.id}`).classList.remove("open");
      });
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  document.getElementById("add-btn").addEventListener("click", addOutfit);
  document.getElementById("inp-url").addEventListener("keydown", e => { if(e.key==="Enter") addOutfit(); });
</script>
</body>
</html>
